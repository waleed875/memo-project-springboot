name: Windows PowerShell 5.1 bootstrap stdin compatibility

on:
  pull_request:
    paths:
      - 'deploy/bootstrap-preview-admin.ps1'
      - 'deploy/Write-Utf8PasswordToProcess.ps1'
      - 'deploy/tests/BootstrapStdinCompatibility.ps1'
      - '.github/workflows/windows-bootstrap-stdin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/bootstrap-preview-admin.ps1'
      - 'deploy/Write-Utf8PasswordToProcess.ps1'
      - 'deploy/tests/BootstrapStdinCompatibility.ps1'
      - '.github/workflows/windows-bootstrap-stdin-ci.yml'

permissions:
  contents: read

jobs:
  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check UTF-8 stdin transport using Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy\tests\BootstrapStdinCompatibility.ps1
