name: Dashboard C# JSON wire parity
on:
  push:
    paths:
      - 'backend/**'
      - 'tools/dashboard-wire-oracle/**'
      - 'tools/dashboard-react-consumer/**'
      - 'tools/dashboard-browser-e2e/**'
      - '.github/workflows/dashboard-wire-parity-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/dashboard-wire-oracle/**'
      - 'tools/dashboard-react-consumer/**'
      - 'tools/dashboard-browser-e2e/**'
      - '.github/workflows/dashboard-wire-parity-ci.yml'
permissions:
  contents: read
jobs:
  dashboard-wire-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout independent Spring Boot implementation
        uses: actions/checkout@v4
      - name: Checkout pinned C# dashboard DTOs and view builder read only
        uses: actions/checkout@v4
        with:
          repository: waleed875/memo_project
          ref: dd8eb2ba57864eac2371a3addd0b786ccefa2367
          path: legacy-reference
          persist-credentials: false
          sparse-checkout: |
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Models/DashboardDtos.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Models/DashboardContractDtos.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Models/CompanyMetrics.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Services/DashboardContractBuilder.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/tests/MemoDashboard.Web/Frontend.Tests
          sparse-checkout-cone-mode: false
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Serialize four distinct Java HTTP dashboard snapshots
        env:
          MEMO_DASHBOARD_EXPORT_DIR: ${{ runner.temp }}/java-dashboard-snapshots
        run: |
          mvn -B -ntp -f backend/pom.xml -Dtest=DashboardSnapshotWireParityTest test
      - name: Install .NET SDK 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Deserialize with original C# DTOs and rebuild original C# views
        run: |
          dotnet run --configuration Release --project tools/dashboard-wire-oracle/DashboardWireOracle.csproj -- \
            "${{ runner.temp }}/java-dashboard-snapshots" \
            "${{ runner.temp }}/csharp-dashboard-snapshots"
      - name: Diff every nested JSON value of Java HTTP and original C# serialization
        env:
          MEMO_DASHBOARD_EXPORT_DIR: ${{ runner.temp }}/java-dashboard-snapshots
          MEMO_DASHBOARD_CSHARP_ORACLE_DIR: ${{ runner.temp }}/csharp-dashboard-snapshots
        run: |
          mvn -B -ntp -f backend/pom.xml -Dtest=DashboardSnapshotWireParityTest test
      - name: Install Node.js 22 for pinned original React consumer tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend/package-lock.json
      - name: Install original React dependencies without editing its source
        working-directory: legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend
        run: npm ci --no-audit --no-fund
      - name: Mount temporary migration consumer test in original test directory
        shell: bash
        run: |
          set -euo pipefail
          cp tools/dashboard-react-consumer/DashboardSpringConsumer.test.tsx \
            legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/tests/MemoDashboard.Web/Frontend.Tests/DashboardSpringConsumer.test.tsx
      - name: Run original React consumer against real Spring MockMvc snapshot JSON
        working-directory: legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend
        env:
          MEMO_DASHBOARD_EXPORT_DIR: ${{ runner.temp }}/java-dashboard-snapshots
          TZ: Asia/Damascus
        run: npm test -- DashboardSpringConsumer.test.tsx
      - name: Install pinned Playwright browser test runner
        run: npm install --prefix tools/dashboard-browser-e2e --no-audit --no-fund --ignore-scripts
      - name: Install Chromium and runtime dependencies
        run: ./tools/dashboard-browser-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Mount temporary browser-only dashboard entrypoint
        shell: bash
        run: |
          set -euo pipefail
          frontend='legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend'
          cp tools/dashboard-browser-e2e/harness/dashboard-browser-parity.html "$frontend/dashboard-browser-parity.html"
          cp tools/dashboard-browser-e2e/harness/dashboard-browser-parity.tsx "$frontend/dashboard-browser-parity.tsx"
      - name: Run Chromium dashboard browser tests against Spring snapshots
        env:
          MEMO_DASHBOARD_EXPORT_DIR: ${{ runner.temp }}/java-dashboard-snapshots
          TZ: Asia/Damascus
        run: ./tools/dashboard-browser-e2e/node_modules/.bin/playwright test --config tools/dashboard-browser-e2e/playwright.config.mjs
      - name: Upload browser failures (screenshots, traces and JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-chromium-parity-artifacts
          path: tools/dashboard-browser-e2e/results/
          if-no-files-found: ignore
          retention-days: 7
