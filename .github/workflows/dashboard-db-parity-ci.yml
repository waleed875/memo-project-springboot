name: Dashboard DB C# vs Java parity
on:
  push:
    paths:
      - '.github/workflows/dashboard-db-parity-ci.yml'
      - 'backend/**'
      - 'tools/dashboard-db-oracle/**'
      - 'tools/dashboard-full-query-oracle/**'
      - 'tools/dashboard-live-server-e2e/**'
      - 'tools/dashboard-browser-e2e/harness/**'
  pull_request:
    paths:
      - '.github/workflows/dashboard-db-parity-ci.yml'
      - 'backend/**'
      - 'tools/dashboard-db-oracle/**'
      - 'tools/dashboard-full-query-oracle/**'
      - 'tools/dashboard-live-server-e2e/**'
      - 'tools/dashboard-browser-e2e/harness/**'
permissions:
  contents: read
jobs:
  dashboard-database-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: memo_dashboard_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memo_dashboard_parity"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only_password
      PGDATABASE: memo_dashboard_parity
      MEMO_DASHBOARD_PARITY_DB: Host=127.0.0.1;Port=5432;Username=postgres;Password=test_only_password;Database=memo_dashboard_parity
      MEMO_DASHBOARD_DB_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/memo_dashboard_parity
      MEMO_DASHBOARD_DB_USER: postgres
      MEMO_DASHBOARD_DB_PASSWORD: test_only_password
    steps:
      - name: Checkout independent Spring Boot project
        uses: actions/checkout@v4
      - name: Checkout pinned original 001–070 SQL migrations and DTO read-only
        uses: actions/checkout@v4
        with:
          repository: waleed875/memo_project
          ref: dd8eb2ba57864eac2371a3addd0b786ccefa2367
          path: legacy-reference
          persist-credentials: false
          sparse-checkout: |
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/database
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Models/CompanyMetrics.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Models/DashboardDtos.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Models/DashboardContractDtos.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Services/DashboardQueryService.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Services/DashboardContractBuilder.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Services/MetricsCalculator.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Services/DelayCalculator.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Backend/Services/StatusTranslations.cs
            Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend
          sparse-checkout-cone-mode: false
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Replay all 70 original schema migrations on disposable DB
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts_dir="legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/database"
          for n in $(seq 1 70); do
            version=$(printf '%03d' "$n")
            scripts=( "$scripts_dir"/"$version"_*.sql )
            if (( ${#scripts[@]} != 1 )); then
              echo "::error::Missing or duplicate original migration $version"
              exit 1
            fi
            psql -X -v ON_ERROR_STOP=1 -1 -f "${scripts[0]}" >/dev/null
          done
      - name: Seed a fixed and isolated dashboard dataset
        run: psql -X -v ON_ERROR_STOP=1 -f backend/src/test/resources/dashboard-db-parity-seed.sql
      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Execute original C# CompanyMetrics over shared PostgreSQL
        run: |
          dotnet run --configuration Release --project tools/dashboard-db-oracle/DashboardDatabaseOracle.csproj -- \
            "$RUNNER_TEMP/csharp-company-metrics.json"
          test -s "$RUNNER_TEMP/csharp-company-metrics.json"
      - name: Execute untouched original C# full DashboardQueryService
        run: |
          dotnet run --configuration Release --project tools/dashboard-full-query-oracle/DashboardFullQueryOracle.csproj -- \
            "$RUNNER_TEMP/csharp-full-dashboard.json"
          test -s "$RUNNER_TEMP/csharp-full-dashboard.json"
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compare Java JDBC and original C# Dapper for every field
        env:
          MEMO_DASHBOARD_DB_ORACLE: ${{ runner.temp }}/csharp-company-metrics.json
        run: |
          mvn -B -ntp -f backend/pom.xml \
            -Dtest=DashboardCanonicalDatabaseParityTest test
      - name: Compare original dashboard SQL result sets with independent Java readers
        env:
          MEMO_DASHBOARD_FULL_ORACLE: ${{ runner.temp }}/csharp-full-dashboard.json
        run: |
          mvn -B -ntp -f backend/pom.xml \
            -Dtest=DashboardOriginalQueryDatabaseParityTest test
      - name: Seed temporary bcrypt accounts for live-session browser tests
        run: psql -X -v ON_ERROR_STOP=1 -f tools/dashboard-live-server-e2e/seed-browser-auth.sql
      - name: Build real Spring Boot executable
        run: mvn -B -ntp -f backend/pom.xml -DskipTests package
      - name: Start the real Spring Boot server on the disposable PostgreSQL database
        shell: bash
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/memo_dashboard_parity
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test_only_password
          SERVER_PORT: '8080'
          MEMO_SESSION_COOKIE_SECURE: 'false'
        run: |
          set -euo pipefail
          jar=(backend/target/memo-api-*.jar)
          if (( ${#jar[@]} != 1 )); then echo 'Expected one executable Spring Boot JAR'; exit 1; fi
          nohup java -jar "${jar[0]}" > "$RUNNER_TEMP/memo-live-spring.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/memo-live-spring.pid"
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/memo-live-spring.log"
          exit 1
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend/package-lock.json
      - name: Install original React frontend dependencies
        working-directory: legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend
        run: npm ci --no-audit --no-fund
      - name: Install isolated Playwright Chromium runner
        run: |
          npm install --prefix tools/dashboard-live-server-e2e --no-audit --no-fund --ignore-scripts
          ./tools/dashboard-live-server-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Mount test-only proxy and unchanged original React DashboardLive
        env:
          MEMO_ORIGINAL_FRONTEND: legacy-reference/Memo_Project_Handover_v2.0.2/02_الكود_المصدري_Source_Code/source/src/MemoDashboard.Web/Frontend
        run: node tools/dashboard-live-server-e2e/mount-harness.mjs
      - name: Run real Chromium + actual HTTP Spring Boot sessions and PostgreSQL
        env:
          MEMO_CI_BROWSER_PASSWORD: CIOnly_Playwright_58_2026!
          TZ: Asia/Damascus
        run: ./tools/dashboard-live-server-e2e/node_modules/.bin/playwright test --config tools/dashboard-live-server-e2e/playwright.config.mjs
      - name: Upload real Spring browser failures and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-live-session-chromium-artifacts
          path: |
            tools/dashboard-live-server-e2e/results/
            ${{ runner.temp }}/memo-live-spring.log
          if-no-files-found: ignore
          retention-days: 7
