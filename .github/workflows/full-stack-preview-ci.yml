name: Full-stack Docker preview smoke

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/migrations/**'
      - 'deploy/**'
      - '.github/workflows/full-stack-preview-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/migrations/**'
      - 'deploy/**'
      - '.github/workflows/full-stack-preview-ci.yml'

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: CIOnly_Ephemeral_Postgres_Password
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build backend JAR with cached Maven dependencies
        run: mvn -B -ntp -f backend/pom.xml -DskipTests package
      - name: Check complete Compose configuration
        run: docker compose -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml config --quiet
      - name: Check alternate host port configuration (Windows fallback)
        shell: bash
        run: |
          MEMO_FRONTEND_PORT=8082 docker compose -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); p=c["services"]["memo-frontend"]["ports"]; assert any(str(x.get("published"))=="8082" and int(x.get("target"))==80 for x in p), p'
      - name: Build and start PostgreSQL, Spring Boot and React/Nginx
        run: |
          docker compose -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml up --build -d
      - name: Await real Spring Boot health and browser entrypoint
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"' &&
               curl --fail --silent http://127.0.0.1:8081/ | grep -q '/src/\|/assets/'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker compose -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml ps
            exit 1
          fi
      - name: Check migrated DB and reject legacy public dashboard route
        shell: bash
        run: |
          set -euo pipefail
          version=$(docker compose -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml exec -T postgres psql -XAt -v ON_ERROR_STOP=1 -U memo_preview -d memodb_preview -c "select database_version from system.database_settings where singleton is true")
          test "$version" = '070'
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/dashboard/snapshot)
          test "$status" = 403
          curl --fail --silent http://127.0.0.1:8081/api/admin/session | grep -q '"authenticated":false'
          curl --fail --silent http://127.0.0.1:8081/api/admin/csrf | grep -q '"token"'
      - name: Activate pristine preview administrator one time and verify login
        shell: bash
        run: |
          set -euo pipefail
          files=(-f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml)
          command=(docker compose "${files[@]}" run --rm -T --no-deps
            -e SPRING_PROFILES_ACTIVE=preview-admin-bootstrap
            -e SPRING_MAIN_WEB_APPLICATION_TYPE=none
            -e MEMO_PREVIEW_BOOTSTRAP_STDIN=true memo-api)
          # Disposable CI-only credential; never read a real user/production secret.
          printf '%s\n' 'CI-Only-Preview-Admin-Pass-12345' | "${command[@]}"
          count=$(docker compose "${files[@]}" exec -T postgres psql -XAt -U memo_preview -d memodb_preview -c "select count(*) from auth.users where username='admin' and password_hash like '\$2%'")
          test "$count" = '1'
          if printf '%s\n' 'Second-Bootstrap-Should-Fail-123' | "${command[@]}"; then
            echo "ERROR: administrator was initialized a second time" >&2
            exit 1
          fi
          jar=$(mktemp)
          trap 'rm -f "$jar"' EXIT
          token=$(curl --fail --silent -c "$jar" http://127.0.0.1:8081/api/admin/csrf | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          auth=$(curl --fail --silent -b "$jar" -c "$jar" -H "X-CSRF-TOKEN: $token" -H 'Content-Type: application/json' -d '{"username":"admin","password":"CI-Only-Preview-Admin-Pass-12345"}' http://127.0.0.1:8081/api/admin/login)
          printf '%s' "$auth" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['authenticated'] and d['role']=='ADMIN',d"
          curl --fail --silent -b "$jar" http://127.0.0.1:8081/api/admin/system-status | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['database']=='CONNECTED' and d['databaseVersion']=='070' and d['migrations']=='CURRENT',d"
      - name: Preview diagnostics on failure
        if: failure()
        run: docker compose -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml logs --tail=200
      - name: Remove disposable preview volumes
        if: always()
        run: docker compose -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml -f deploy/compose.ci.yaml down -v --remove-orphans
