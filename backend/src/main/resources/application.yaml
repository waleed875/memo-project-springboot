spring:
  application:
    name: memo-api
  datasource:
    # Preview only. Always override with an isolated test DB in Docker or CI.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memodb_preview}
    username: ${SPRING_DATASOURCE_USERNAME:memo_preview}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
