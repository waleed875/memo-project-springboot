# Nonproduction, isolated developer preview; migrations run only on an EMPTY PostgreSQL volume.
# docker compose --env-file deploy/.env.preview -f deploy/compose.preview.yaml -f deploy/compose.frontend-preview.yaml up --build -d
name: memo-springboot-preview

services:
  postgres:
    # Build a tiny wrapper around the official image so the init script always
    # has LF line endings, even if Git checked it out with Windows CRLF.
    build:
      context: .
      dockerfile: PostgresPreview.Dockerfile
    environment:
      POSTGRES_DB: memodb_preview
      POSTGRES_USER: memo_preview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.preview}
    volumes:
      - postgres_preview_data:/var/lib/postgresql/data
      - ../database/migrations:/opt/memo-migrations:ro
    networks: [memo_internal]
    healthcheck:
      # A half-initialized database must NOT be marked healthy.
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB >/dev/null && psql -XAt -U $POSTGRES_USER -d $POSTGRES_DB -c 'select database_version from system.database_settings where singleton is true' 2>/dev/null | grep -qx 070"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  memo-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memodb_preview
      SPRING_DATASOURCE_USERNAME: memo_preview
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.preview}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [memo_internal, memo_edge]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  memo_internal:
    internal: true
  memo_edge:
    driver: bridge

volumes:
  postgres_preview_data:
